# Roadmap configuration, read by the roadmap CLI.

# The roadmap release this repo runs, when its package.json doesn't pin the
# package. `roadmap init` sets it, `roadmap update` moves it, and the GitHub
# Action runs it.
# version = "x.y.z"

# What refs resolve against, relative to this directory. Default: the repo root.
# root = ".."

# Ref kinds beyond the built-in `files` (a path relative to root). Each kind
# is a path template where {} is replaced by the ref's value. A list of
# templates means any of them may match, and glob patterns are allowed.
[refs]
# specs   = "openspec/specs/{}"
# changes = ["openspec/changes/{}", "openspec/changes/archive/*-{}"]
# adrs    = "docs/adr/{}.md"

# Milestones: named points in time. An item is due for one with
# `milestone = "beta"`, or waits on one with `depends_on = ["beta"]`.
# Once one is met, add `reached = <date>`: it then counts as done, like a
# shipped item, and stays in depends_on as history.
[milestones]
# beta = { title = "Public beta", date = 2026-12-01 }
# alpha = { title = "Private alpha", date = 2026-11-01, reached = 2026-10-30 }
