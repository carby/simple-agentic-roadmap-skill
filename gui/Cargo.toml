[package]
name = "roadmap-gui"
version = "0.1.0"
edition = "2024"
description = "A gitk-style graphical client for the roadmap, driving the roadmap CLI"
license = "MIT"
publish = false

[dependencies]
# glow rather than the default wgpu: lighter, and it runs on WSLg and older GL.
# No `persistence`: the GUI keeps no state between runs.
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
jiff = "1.0.3"
notify = "9.0.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
wait-timeout = "0.2.1"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
