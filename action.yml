name: Roadmap check
description: Validate a Now/Next/Later roadmap kept by the roadmap skill.
branding:
  icon: map
  color: blue

inputs:
  dir:
    description: The roadmap directory.
    default: roadmap
  base:
    description: A git ref to hold archive/ append-only against, e.g. origin/main. Needs actions/checkout with fetch-depth 0.
    default: ""
  package:
    description: >-
      The npm spec to run, e.g. simple-agentic-roadmap-skill@2.0.0 or a tarball path. By default it is the
      version pinned in the repo's package-lock.json, then the range in its package.json, then this action's own.
    default: ""
  node-version:
    description: Node to set up if the runner has no Node 22.18 or newer already.
    default: "22"

runs:
  using: composite
  steps:
    - id: node
      shell: bash
      run: |
        if node -e 'const [a, b] = process.versions.node.split(".").map(Number); process.exit(a > 22 || (a === 22 && b >= 18) ? 0 : 1)' 2>/dev/null; then
          echo "setup=false" >> "$GITHUB_OUTPUT"
        else
          echo "setup=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.node.outputs.setup == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      env:
        ROADMAP_DIR: ${{ inputs.dir }}
        ROADMAP_BASE: ${{ inputs.base }}
        ROADMAP_PACKAGE: ${{ inputs.package }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        spec="$(node "$ACTION_DIR/scripts/action-spec.mjs" . "$ACTION_DIR" "$ROADMAP_PACKAGE")"
        echo "Running $spec"
        npx --yes --package="$spec" -- roadmap check --dir "$ROADMAP_DIR" ${ROADMAP_BASE:+--base "$ROADMAP_BASE"}
