name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # This repo's own test suite: the CLI, the template, SKILL.md and the docs.
  # The test files are TypeScript, which Node runs only from 22.18, so they
  # always run on the newest 22. On `floor`, every test that runs the CLI as a
  # subprocess runs it on Node 22.0.0 instead, the oldest that package.json's
  # engines allows, and so does the bundled CLI.
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [latest, floor]
    name: node (${{ matrix.runtime }})
    steps:
      - uses: actions/checkout@v7
      - if: matrix.runtime == 'floor'
        uses: actions/setup-node@v7
        with:
          node-version: 22.0.0
      - if: matrix.runtime == 'floor'
        name: Run the CLI on Node 22.0.0
        run: echo "ROADMAP_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - run: npm test
      - name: The bundled CLI that roadmap.zip carries runs
        run: |
          npm run bundle
          "${ROADMAP_TEST_NODE:-node}" --version
          "${ROADMAP_TEST_NODE:-node}" build/roadmap.mjs check
          "${ROADMAP_TEST_NODE:-node}" build/roadmap.mjs check --dir test/fixtures/valid/roadmap

  # The client-side check, run the way a consuming repo runs it: through the
  # action, against a fixture and against this repo's own roadmap. The
  # package isn't published from here, so the action gets this commit's
  # build as a tarball through its `package` input.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack this commit
        id: pack
        run: echo "tgz=$RUNNER_TEMP/$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Fixture roadmap via the action
        uses: ./
        with:
          dir: test/fixtures/valid/roadmap
          package: ${{ steps.pack.outputs.tgz }}
      - name: Pick the base for the append-only check
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then echo "ref=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Dogfood roadmap via the action
        uses: ./
        with:
          dir: roadmap
          package: ${{ steps.pack.outputs.tgz }}
          base: ${{ steps.base.outputs.ref }}
