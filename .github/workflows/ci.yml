name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # This repo's own test suite: the script, the template, SKILL.md and the docs.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # The client-side check, run the way a consuming repo runs it: through the
  # published action, against a fixture and against this repo's own roadmap.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fixture roadmap via the action
        uses: ./
        with:
          dir: tests/fixtures/valid/roadmap
          script: scripts/roadmap.py
      - name: Pick the base for the append-only check
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then echo "ref=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Dogfood roadmap via the action
        uses: ./
        with:
          dir: roadmap
          script: scripts/roadmap.py
          base: ${{ steps.base.outputs.ref }}
