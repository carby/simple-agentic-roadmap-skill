name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The CLI and its package live in cli/; the action and the roadmap stay at the
# root. `working-directory` applies to run steps only, never to `uses:` steps.
defaults:
  run:
    working-directory: cli

jobs:
  # The CLI in cli/: its test suite, the template, SKILL.md and the docs.
  # The test files are TypeScript, which Node runs only from 22.18, so they
  # always run on the newest 22. On `floor`, every test that runs the CLI as a
  # subprocess runs it on Node 22.0.0 instead, the oldest that package.json's
  # engines allows, and so does the bundled CLI.
  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [latest, floor]
    name: cli (${{ matrix.runtime }})
    steps:
      - uses: actions/checkout@v7
      - if: matrix.runtime == 'floor'
        uses: actions/setup-node@v7
        with:
          node-version: 22.0.0
      - if: matrix.runtime == 'floor'
        name: Run the CLI on Node 22.0.0
        run: echo "ROADMAP_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - run: npm test
      - name: The bundled CLI that roadmap.zip carries runs
        run: |
          npm run bundle
          "${ROADMAP_TEST_NODE:-node}" --version
          "${ROADMAP_TEST_NODE:-node}" build/roadmap.mjs check --dir ../roadmap
          "${ROADMAP_TEST_NODE:-node}" build/roadmap.mjs check --dir test/fixtures/valid/roadmap

  # The GUI in gui/: format, lint, build and test with the toolchain that
  # rust-toolchain.toml pins. The tests run the real CLI, built from this
  # commit, to check that its export still parses.
  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Build the CLI the tests run
        working-directory: cli
        run: npm ci && npm run build
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
        env:
          ROADMAP_CLI: node ${{ github.workspace }}/cli/bin/roadmap.js

  # The gate on the other platforms: the GUI's tests on macOS and Windows,
  # building only what they need. The gui job covers Linux. Without
  # ROADMAP_CLI the real-CLI test skips itself. On Windows the tests that
  # spawn a CLI are gated out (their fake CLIs are shell scripts), so only
  # the platform-neutral ones run there. The cache is saved from master only.
  gui-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    name: gui-platforms (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gui
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --locked

  # Delivery: once the gate is green on master, the GUI's release build for
  # each platform, kept as a workflow artifact so it can be tried without
  # Rust. Branches and pull requests get no binaries.
  gui-delivery:
    needs: [gui, gui-platforms]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: roadmap-gui
          - os: macos-latest
            name: macos-arm64
            exe: roadmap-gui
          - os: windows-latest
            name: windows-x86_64
            exe: roadmap-gui.exe
    name: gui-delivery (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gui
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - run: cargo build --release --locked
      - name: The binary runs
        run: target/release/${{ matrix.exe }} --version
      - uses: actions/upload-artifact@v7
        with:
          name: roadmap-gui-${{ matrix.name }}
          path: gui/target/release/${{ matrix.exe }}
          if-no-files-found: error

  # The client-side check, run the way a consuming repo runs it: through the
  # action, against a fixture and against this repo's own roadmap. The
  # package isn't published from here, so the action gets this commit's
  # build as a tarball through its `package` input.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - name: Pack this commit
        id: pack
        run: echo "tgz=$RUNNER_TEMP/$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Fixture roadmap via the action
        uses: ./
        with:
          dir: cli/test/fixtures/valid/roadmap
          package: ${{ steps.pack.outputs.tgz }}
      - name: Pick the base for the append-only check
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then echo "ref=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Dogfood roadmap via the action
        uses: ./
        with:
          dir: roadmap
          package: ${{ steps.pack.outputs.tgz }}
          base: ${{ steps.base.outputs.ref }}
