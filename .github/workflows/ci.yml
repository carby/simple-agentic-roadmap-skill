name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # This repo's own test suite: the CLI, the template, SKILL.md and the docs.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - run: npx vitest run

  # The client-side check, run the way a consuming repo runs it: through the
  # published action, against a fixture and against this repo's own roadmap.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fixture roadmap via the action
        uses: ./
        with:
          dir: test/fixtures/valid/roadmap
          script: scripts/roadmap.py
      - name: Pick the base for the append-only check
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then echo "ref=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Dogfood roadmap via the action
        uses: ./
        with:
          dir: roadmap
          script: scripts/roadmap.py
          base: ${{ steps.base.outputs.ref }}
