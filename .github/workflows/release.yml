name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The Claude app installs a skill from an uploaded zip: one folder with
  # SKILL.md at its top. Only what the agent reads or runs goes in it, and the
  # CLI goes in bundled into one file, since the app has no npm.
  skill-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - name: Build roadmap.zip
        run: |
          node scripts/stage-zip.mjs stage
          (cd stage && zip -qr ../roadmap.zip roadmap)
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" roadmap.zip --clobber

  # npm trusted publishing: no token, the registry trusts this workflow
  # through OIDC and adds provenance itself. It needs npm 11.5 or later. A
  # version already on npm (the first one is published by hand) is skipped.
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - name: Publish, unless this version is on npm already
        run: |
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm; nothing to publish"
          else
            npm publish
          fi
